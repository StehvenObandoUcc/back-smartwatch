openapi: 3.1.0
info:
  title: API de recordatorios de medicamentos
  version: 0.4.0
  x-closed-phase: 2
  description: |
    Contrato de la API. Fuente de verdad del backend y de los clientes generados por el frontend
    (Orval para la web, openapi-generator para el reloj Wear OS).

    Convenciones:
    - Rutas en kebab-case y plural; campos JSON en camelCase; fechas ISO 8601 con zona; IDs UUID.
    - Errores en RFC 9457 (`application/problem+json`) con `type`, `title`, `status`, `detail`, `code`.
    - Paginación por cursor (`?cursor=&limit=`) con respuesta `{ items, nextCursor }`.

    Autenticación (`Authorization: Bearer <accessToken>`, JWT de 15 min). Hay dos tipos de sesión:
    - **Usuario (web)**: se abre con `POST /auth/register` o `POST /auth/login` y se renueva con
      `POST /auth/refresh`. El token de acceso va en el JSON; el **refresh token nunca va en el
      JSON**: viaja solo en la cookie `__Secure-refresh-token` (`HttpOnly; Secure;
      SameSite=Strict; Path=/auth; Max-Age=2592000`). El navegador la envía sola a `/auth/*`; la
      web debe llamar con `credentials: "include"`. CORS con credenciales solo para el origen del
      panel web. `POST /auth/logout` la borra (`Max-Age=0`). Su token de acceso no sirve en
      `/devices/me/*` (403).
    - **Reloj**: se abre con `POST /devices/token` (`grantType: device_code`) y se renueva con el
      mismo endpoint (`grantType: refresh_token`). Recibe **ambos tokens en JSON** (no usa
      cookies). Su token **solo** sirve en `/devices/me/*`; en cualquier otra ruta responde 403.
      `POST /auth/refresh` rechaza refresh tokens de reloj (401).
    En ambos casos el refresh token es rotativo: cada uso devuelve uno nuevo e invalida el anterior;
    reutilizar uno ya rotado revoca toda la familia (`code: refresh_token_reused`). El refresh token
    de usuario caduca a los 30 días; el del reloj, tras 90 días sin uso. Desvincular un reloj
    revoca sus tokens.

    Pacientes y cuidadores:
    - Al registrarse con `role: patient` se crea automáticamente su registro en `/patients`
      (`managed: false`, mismo `displayName` y `timezone`) y `user.patientId` apunta a él. Ese
      paciente puede invitar cuidadores y gestiona sus propios consentimientos.
    - Un cuidador puede crear pacientes gestionados (`managed: true`, sin cuenta propia) con
      `POST /patients`; otorga sus consentimientos en su nombre y queda registrado en `grantedBy`.
    - Cualquier ruta `/patients/{patientId}/...` sobre un paciente con el que el usuario no tiene
      un vínculo activo responde **404** (no 403), para no revelar que existe. 403 se reserva a
      acciones sobre un paciente accesible que el rol no permite.

    Códigos de un solo uso (invitación de cuidador y vinculación del reloj): caducan, se consumen
    al usarse y tienen límite de intentos por usuario/IP; al superarlo responden 429 con
    `Retry-After`.

    Cada operación lleva `x-phase` (fase en que se implementa). `info.x-closed-phase` es la última
    fase cerrada: todas sus operaciones deben estar implementadas.

    Fases:
    - 0 Fundaciones: salud.
    - 1 Cuentas y vinculación: registro, sesión, perfil, consentimientos, pacientes, cuidadores
      y vinculación del reloj por código (flujo tipo device code, RFC 8628).
    - 2 Sprint A (plan exprés, fases 2 y 3 juntas): medicamentos, horarios simples (horas del día,
      días de la semana, fechas de inicio y fin; sin RRULE), plan de 7 días versionado, eventos
      de toma idempotentes, historial y adherencia. `MISSED` se calcula al consultar.
    - 3 Sprint B (plan exprés, fases 4 y 5 juntas): verificación de correo y recuperación de
      contraseña, canales y preferencias de notificación (Telegram y correo), reportes semanales
      en PDF y chat con IA (SSE para la web, respuesta corta para el reloj). El envío de avisos
      (alerta de dosis omitida, reporte semanal) lo hace un worker en segundo plano: no hay
      endpoint para dispararlos.
servers:
  - url: http://localhost:8000
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: health
    description: Sondas de vida y disponibilidad
  - name: auth
    description: Registro y sesión
  - name: users
    description: Perfil y consentimientos del usuario autenticado
  - name: patients
    description: Pacientes y sus cuidadores
  - name: devices
    description: Vinculación y gestión del reloj
  - name: medications
    description: Medicamentos y horarios de un paciente
  - name: plan
    description: Plan de 7 días de un paciente
  - name: doses
    description: Eventos de toma, historial y adherencia
  - name: notifications
    description: Canales (Telegram, correo) y preferencias de notificación
  - name: reports
    description: Reportes semanales de adherencia
  - name: chat
    description: Asistente de IA sobre el plan del paciente

paths:
  # ─── Fase 0 ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [health]
      operationId: getHealth
      x-phase: 0
      summary: Liveness
      description: Indica que el proceso está vivo. No consulta dependencias.
      security: []
      responses:
        "200":
          description: El servicio está vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      x-phase: 0
      summary: Readiness
      description: Comprueba las dependencias (Postgres y Redis).
      security: []
      responses:
        "200":
          description: Todas las dependencias responden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Alguna dependencia no responde.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.example.com/problems/dependency-unavailable
                title: Dependencia no disponible
                status: 503
                detail: Postgres no responde.
                code: dependency_unavailable

  # ─── Fase 1: auth ────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      x-phase: 1
      summary: Crear cuenta
      description: |
        Crea un usuario y abre sesión web. Si `role` es `patient`, en la misma transacción se crea
        su registro en `/patients` (`managed: false`, con el `displayName` y `timezone` del
        registro) y `user.patientId` apunta a él. Si `role` es `caregiver`, `user.patientId` es
        null. Devuelve el token de acceso en el JSON y el refresh token en la cookie
        `__Secure-refresh-token`. Límite de peticiones por IP (429). Encola un correo de
        verificación (`POST /auth/verify-email`); no hace falta verificarlo para usar la cuenta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Cuenta creada y sesión abierta.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      x-phase: 1
      summary: Iniciar sesión
      description: |
        Abre sesión web: token de acceso en el JSON y refresh token en la cookie
        `__Secure-refresh-token`. Credenciales incorrectas: 401 (`code: invalid_credentials`),
        sin distinguir si el correo existe. Límite de peticiones por IP y por correo (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión abierta.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      x-phase: 1
      summary: Renovar la sesión web
      description: |
        Sin cuerpo. Lee el refresh token de la cookie `__Secure-refresh-token`, lo rota y devuelve
        un token de acceso nuevo en el JSON y el refresh token nuevo en la cookie.
        - Sin cookie, o refresh token inválido o caducado: 401 y la cookie se borra.
        - Reutilizar un refresh token ya rotado revoca toda la familia (401,
          `code: refresh_token_reused`) y la cookie se borra.
        - Un refresh token de reloj aquí da 401; los relojes renuevan con `POST /devices/token`.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Sin sesión válida. La respuesta borra la cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-phase: 1
      summary: Cerrar sesión web
      description: |
        Sin cuerpo y sin token de acceso (puede haber caducado). Revoca la familia del refresh
        token de la cookie, si la hay, y borra la cookie. Idempotente: sin cookie también
        responde 204.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"

  # ─── Fase 1: usuario ─────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      x-phase: 1
      summary: Usuario autenticado
      responses:
        "200":
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      operationId: updateMe
      x-phase: 1
      summary: Actualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /users/me/consents:
    get:
      tags: [users]
      operationId: listMyConsents
      x-phase: 1
      summary: Consentimientos del usuario
      description: |
        Consentimientos del usuario autenticado sobre sus propios datos. Para un usuario con rol
        `patient` son los mismos registros que `GET /patients/{patientId}/consents` de su perfil.
        Devuelve siempre las tres finalidades; las no respondidas llevan `granted = false`.
      responses:
        "200":
          description: Estado de cada finalidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/consents/{purpose}:
    put:
      tags: [users]
      operationId: setMyConsent
      x-phase: 1
      summary: Otorgar o retirar un consentimiento propio
      description: |
        Idempotente. Cada cambio queda registrado (historial) con fecha, versión del texto aceptado
        y `grantedBy` = el propio usuario.
      parameters:
        - $ref: "#/components/parameters/ConsentPurposePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentUpdate"
      responses:
        "200":
          description: Consentimiento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Fase 1: pacientes y cuidadores ──────────────────────────────────────────
  /patients:
    get:
      tags: [patients]
      operationId: listPatients
      x-phase: 1
      summary: Pacientes accesibles
      description: |
        Un paciente ve solo su propio perfil. Un cuidador ve los pacientes con vínculo activo y
        los que él mismo gestiona.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de pacientes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [patients]
      operationId: createPatient
      x-phase: 1
      summary: Crear paciente gestionado
      description: |
        Solo cuidadores. Crea un paciente sin cuenta propia (por ejemplo, una persona mayor que solo
        usará el reloj) y un vínculo activo con el cuidador que lo crea.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCreate"
      responses:
        "201":
          description: Paciente creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [patients]
      operationId: getPatient
      x-phase: 1
      summary: Detalle de un paciente
      responses:
        "200":
          description: Paciente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [patients]
      operationId: updatePatient
      x-phase: 1
      summary: Actualizar un paciente
      description: |
        Un paciente con cuenta edita su propio perfil. Un paciente gestionado lo editan sus
        cuidadores con vínculo activo. Un cuidador sobre un paciente con cuenta recibe 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Paciente actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/consents:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [patients]
      operationId: listPatientConsents
      x-phase: 1
      summary: Consentimientos de un paciente
      description: |
        Lo pueden leer el propio paciente y sus cuidadores con vínculo activo. Devuelve siempre las
        tres finalidades; las no respondidas llevan `granted = false`.
      responses:
        "200":
          description: Estado de cada finalidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{patientId}/consents/{purpose}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/ConsentPurposePath"
    put:
      tags: [patients]
      operationId: setPatientConsent
      x-phase: 1
      summary: Otorgar o retirar un consentimiento del paciente
      description: |
        - Paciente con cuenta: solo él (equivale a `PUT /users/me/consents/{purpose}`); un
          cuidador recibe 403.
        - Paciente gestionado: cualquier cuidador con vínculo activo, en nombre del paciente.
        Idempotente. Cada cambio queda en el historial con fecha, versión del texto y `grantedBy`
        (usuario que decidió).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentUpdate"
      responses:
        "200":
          description: Consentimiento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/caregivers:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [patients]
      operationId: listPatientCaregivers
      x-phase: 1
      summary: Cuidadores de un paciente
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de vínculos activos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareLinkPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/caregivers/{userId}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - name: userId
        in: path
        required: true
        description: Id de usuario del cuidador.
        schema:
          type: string
          format: uuid
    delete:
      tags: [patients]
      operationId: revokePatientCaregiver
      x-phase: 1
      summary: Revocar el vínculo de un cuidador
      description: |
        Desactiva el vínculo (no se borra: queda para auditoría) y el cuidador deja de ver al
        paciente de inmediato. Pueden hacerlo:
        - el paciente con cuenta, sobre cualquiera de sus cuidadores;
        - el propio cuidador, sobre su vínculo;
        - en un paciente gestionado, cualquier cuidador con vínculo activo sobre otro, salvo el
          último (409 `code: last_caregiver`, el paciente quedaría sin nadie que lo gestione).
        Idempotente: revocar un vínculo ya inactivo devuelve 204.
      responses:
        "204":
          description: Vínculo inactivo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /patients/{patientId}/caregiver-invitations:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    post:
      tags: [patients]
      operationId: createCaregiverInvitation
      x-phase: 1
      summary: Invitar a un cuidador
      description: |
        Genera un código de un solo uso, válido 72 h, que se comparte a mano con el cuidador (el
        envío por correo llega en la fase 4). Lo crea el paciente con cuenta o, en un paciente
        gestionado, un cuidador con vínculo activo. Límite de invitaciones por paciente y día (429).
      responses:
        "201":
          description: Invitación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /caregiver-invitations/{code}/accept:
    post:
      tags: [patients]
      operationId: acceptCaregiverInvitation
      x-phase: 1
      summary: Aceptar una invitación
      description: |
        Solo cuidadores (un paciente recibe 403). Crea o reactiva el vínculo y consume el código.
        Un código inexistente, caducado o ya usado responde 404 (`code: invitation_not_found`).
        Límite de intentos por usuario e IP (429) para impedir adivinar códigos. Si el cuidador ya
        tiene un vínculo activo con ese paciente: 409 (`code: already_linked`).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/InvitationCode"
      responses:
        "201":
          description: Vínculo activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ─── Fase 1: reloj ───────────────────────────────────────────────────────────
  /devices/pairing-codes:
    post:
      tags: [devices]
      operationId: createPairingCode
      x-phase: 1
      summary: El reloj pide un código de vinculación
      description: |
        Paso 1 del flujo tipo device code (RFC 8628). El reloj muestra `code` en pantalla y guarda
        `deviceCode` en secreto para consultar `POST /devices/token` cada `interval` segundos.
        Ambos son de un solo uso y caducan a los `expiresIn` segundos (10 min). Límite de
        peticiones por IP (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeRequest"
      responses:
        "201":
          description: Código creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /devices/pairing-codes/{code}/confirm:
    post:
      tags: [devices]
      operationId: confirmPairingCode
      x-phase: 1
      summary: Confirmar la vinculación desde la web
      description: |
        Paso 2. Desde la web, el usuario escribe el código que muestra el reloj y envía en el
        cuerpo el `patientId` al que se vinculará. Puede hacerlo el paciente con cuenta (sobre sí
        mismo) o un cuidador con vínculo activo.
        - Código inexistente, caducado o ya confirmado: 404 (`code: pairing_code_not_found`).
        - `patientId` sin vínculo activo con el usuario: 404 (`code: patient_not_found`).
        - Límite de intentos por usuario e IP (429) para impedir adivinar códigos.
        Un paciente solo tiene un reloj activo: si ya había otro, se desvincula y se revocan sus
        tokens.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingConfirm"
      responses:
        "200":
          description: Reloj vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /devices/token:
    post:
      tags: [devices]
      operationId: requestDeviceToken
      x-phase: 1
      summary: El reloj obtiene o renueva sus tokens
      description: |
        Único endpoint de tokens del reloj, según `grantType`:

        **`device_code`** (paso 3 de la vinculación). Mientras la web no confirme responde 400 con
        `code`:
        - `authorization_pending`: sigue esperando.
        - `slow_down`: consulta demasiado rápido; suma 5 s a `interval`.
        - `expired_token`: el código caducó o ya se usó; hay que pedir otro.
        Tras la confirmación devuelve los tokens una sola vez y el `deviceCode` queda consumido.

        **`refresh_token`** (renovación). El reloj renueva su token de acceso antes de que caduque
        o al recibir 401. El refresh token rota en cada uso; reutilizar uno ya rotado revoca los
        tokens del reloj (`code: refresh_token_reused`) y hay que volver a vincularlo. Un refresh
        token inválido, caducado (90 días sin uso) o de un reloj desvinculado responde 401. Un
        refresh token de usuario aquí también responde 401.

        Límite de peticiones por IP y por `deviceCode` (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Reloj vinculado; tokens del dispositivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Vinculación aún no completada o código caducado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.example.com/problems/authorization-pending
                title: Vinculación pendiente
                status: 400
                detail: El código aún no se ha confirmado desde la web.
                code: authorization_pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /devices/me:
    get:
      tags: [devices]
      operationId: getMyDevice
      x-phase: 1
      summary: El reloj consulta su vinculación
      description: Solo con token de reloj; un token de usuario recibe 403.
      responses:
        "200":
          description: Reloj y paciente vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /devices/me/push-token:
    put:
      tags: [devices]
      operationId: setMyPushToken
      x-phase: 1
      summary: Registrar el token FCM del reloj
      description: Solo con token de reloj; un token de usuario recibe 403. Idempotente; reemplaza el anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUpdate"
      responses:
        "204":
          description: Token guardado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/devices:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [devices]
      operationId: listPatientDevices
      x-phase: 1
      summary: Relojes de un paciente
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de relojes activos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: unpairDevice
      x-phase: 1
      summary: Desvincular un reloj
      description: |
        Lo hacen el paciente con cuenta o un cuidador con vínculo activo. Revoca los tokens del
        reloj de inmediato. Un reloj de un paciente sin vínculo con el usuario responde 404.
        Idempotente: desvincular un reloj ya desvinculado devuelve 204.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Reloj desvinculado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Sprint A (x-phase 2): medicamentos, horarios, plan, eventos y adherencia ────
  /patients/{patientId}/medications:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [medications]
      operationId: listMedications
      x-phase: 2
      summary: Medicamentos de un paciente
      description: |
        Por defecto solo los activos; `?includeArchived=true` incluye los archivados. Requiere
        vínculo activo con el paciente (si no, 404) y consentimiento `health_data` del paciente
        (si no, 403 `consent_required`).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Página de medicamentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [medications]
      operationId: createMedication
      x-phase: 2
      summary: Crear un medicamento
      description: Sube la versión del plan del paciente. Mismas reglas de acceso y consentimiento que el listado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationCreate"
      responses:
        "201":
          description: Medicamento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/medications/{medicationId}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/MedicationIdPath"
    get:
      tags: [medications]
      operationId: getMedication
      x-phase: 2
      summary: Un medicamento
      responses:
        "200":
          description: Medicamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [medications]
      operationId: updateMedication
      x-phase: 2
      summary: Editar un medicamento
      description: Actualización parcial. Sube la versión del plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationUpdate"
      responses:
        "200":
          description: Medicamento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [medications]
      operationId: archiveMedication
      x-phase: 2
      summary: Archivar un medicamento
      description: |
        Borrado lógico: deja de aparecer en el plan pero se conserva su historial de tomas.
        Idempotente. Sube la versión del plan.
      responses:
        "204":
          description: Medicamento archivado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{patientId}/medications/{medicationId}/schedules:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/MedicationIdPath"
    get:
      tags: [medications]
      operationId: listSchedules
      x-phase: 2
      summary: Horarios de un medicamento
      responses:
        "200":
          description: Horarios (sin paginar; un medicamento tiene pocos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [medications]
      operationId: createSchedule
      x-phase: 2
      summary: Añadir un horario
      description: Sube la versión del plan. Máximo 10 horarios por medicamento (422 si se supera).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Horario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/medications/{medicationId}/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/MedicationIdPath"
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [medications]
      operationId: updateSchedule
      x-phase: 2
      summary: Editar un horario
      description: |
        Actualización parcial. Sube la versión del plan. Cambiar las horas de un horario no
        reescribe las tomas ya registradas: el historial conserva su `scheduledAt` original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Horario actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [medications]
      operationId: deleteSchedule
      x-phase: 2
      summary: Eliminar un horario
      description: Idempotente. Sube la versión del plan. Las tomas ya registradas se conservan.
      responses:
        "204":
          description: Horario eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /devices/me/plan:
    get:
      tags: [plan]
      operationId: getMyPlan
      x-phase: 2
      summary: Plan de 7 días del reloj
      description: |
        Solo con token de reloj (403 con token de usuario). Devuelve las dosis de los próximos 7
        días, desde el inicio del día local del paciente, calculadas con su zona horaria.
        `version` sube con cada cambio de medicamentos u horarios del paciente. El `ETag` cambia
        cuando cambia la versión o el día local; con `If-None-Match` igual responde 304 sin
        cuerpo. Si el paciente no ha dado el consentimiento `health_data`, 403
        (`code: consent_required`).
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Plan vigente.
          headers:
            ETag:
              description: Validador del plan, p. ej. `"3-2026-10-01"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "304":
          description: El plan no cambió.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /patients/{patientId}/plan:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [plan]
      operationId: getPatientPlan
      x-phase: 2
      summary: Plan de 7 días de un paciente (agenda web)
      description: Mismo cuerpo que `GET /devices/me/plan`, sin ETag. Para la agenda de hoy y de la semana.
      responses:
        "200":
          description: Plan vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /devices/me/dose-events:
    post:
      tags: [doses]
      operationId: createMyDoseEvents
      x-phase: 2
      summary: Subir eventos de toma (lote, idempotente)
      description: |
        Solo con token de reloj. Hasta 100 eventos por lote. Idempotente por `eventId`: reenviar un
        evento ya guardado devuelve `outcome: duplicate` sin duplicar nada. Cada evento se
        resuelve por separado y el lote responde 200; un evento inválido no hace fallar a los
        demás. Un evento solo se acepta si `scheduleId` pertenece al paciente del reloj y
        `scheduledAt` es una hora que ese horario generaba; si no, `outcome: rejected` con
        `code` (`schedule_not_found`, `invalid_scheduled_at`). Una dosis tiene como mucho un
        evento: si llega otro `eventId` para la misma dosis (`scheduleId` + `scheduledAt`), gana
        el primero y el segundo se rechaza con `code: dose_already_recorded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoseEventBatch"
      responses:
        "200":
          description: Resultado por evento, en el mismo orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoseEventBatchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/dose-history:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [doses]
      operationId: listDoseHistory
      x-phase: 2
      summary: Historial de dosis de un paciente
      description: |
        Dosis ya vencidas, de la más reciente a la más antigua, con su estado. Una dosis sin
        evento cuya hora programada pasó hace más de 60 minutos se informa como `MISSED`
        (se calcula al consultar). Las dosis sin evento futuras o dentro de la ventana de 60 min
        no aparecen; una dosis con evento aparece siempre. Solo cuentan las dosis que el horario
        ya generaba cuando se creó o editó, y mientras el medicamento no estaba archivado.
        Rango por defecto: últimos 7 días; máximo 90 días, y `from` no puede ser posterior a
        `to` (422).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Página del historial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoseHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/adherence:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [doses]
      operationId: getAdherence
      x-phase: 2
      summary: Porcentaje de adherencia de un paciente
      description: |
        `percentage = taken / (taken + skipped + missed) * 100` sobre las dosis vencidas del
        rango (mismas reglas y rango por defecto que el historial). `null` si no hubo dosis
        vencidas.
      parameters:
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Adherencia del rango.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adherence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Sprint B (x-phase 3): cuenta por correo, notificaciones, reportes y chat ────
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      x-phase: 3
      summary: Verificar el correo con el token recibido
      description: |
        El token llega por correo en un enlace al panel (`{WEB_ORIGIN}/verify-email?token=...`),
        es de un solo uso y caduca a las 24 horas. Token inválido, caducado o ya usado: 400
        (`code: invalid_token`). Verificar un correo ya verificado con un token válido devuelve 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
      responses:
        "204":
          description: Correo verificado.
        "400":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      x-phase: 3
      summary: Reenviar el correo de verificación
      description: |
        Solo con sesión de usuario. Invalida el token anterior. Si el correo ya está verificado
        devuelve 204 sin enviar nada. Límite de peticiones por usuario (429).
      responses:
        "202":
          description: Correo encolado para envío.
        "204":
          description: El correo ya estaba verificado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      x-phase: 3
      summary: Pedir el correo de recuperación de contraseña
      description: |
        Responde siempre 202, exista o no el correo, para no revelar qué cuentas existen. Si existe
        y está verificado, se envía un enlace al panel (`{WEB_ORIGIN}/reset-password?token=...`) con
        un token de un solo uso que caduca a la hora. Límite de peticiones por IP y por correo (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Si la cuenta existe, recibirá un correo.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      x-phase: 3
      summary: Fijar una contraseña nueva con el token de recuperación
      description: |
        Token inválido, caducado o ya usado: 400 (`code: invalid_token`). Al cambiar la contraseña
        se revocan todos los refresh tokens del usuario (web); los relojes vinculados no se tocan.
        No abre sesión: la web lleva al usuario a iniciarla.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Contraseña cambiada.
        "400":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /users/me/notification-channels:
    get:
      tags: [notifications]
      operationId: listMyNotificationChannels
      x-phase: 3
      summary: Canales de notificación del usuario
      description: |
        Siempre devuelve los dos canales. `email` es el correo de la cuenta (`linked` siempre
        true; `verified` indica si se verificó). `telegram` está vinculado cuando el usuario
        abrió el enlace de `POST /users/me/notification-channels/telegram/link`.
      responses:
        "200":
          description: Canales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me/notification-channels/telegram/link:
    post:
      tags: [notifications]
      operationId: createTelegramLink
      x-phase: 3
      summary: Pedir el enlace para vincular Telegram
      description: |
        Devuelve `https://t.me/<Bot>?start=<token>`. El token es de un solo uso y caduca a los 15
        minutos; pedir otro invalida el anterior. Al abrir el enlace y pulsar "Iniciar", el bot
        recibe el token por el webhook y vincula el chat con el usuario; el bot solo puede escribir
        a quien lo inició. La web consulta `GET /users/me/notification-channels` hasta ver
        `telegram.linked: true`. Límite de peticiones por usuario (429).
      responses:
        "201":
          description: Enlace creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: "El bot no está configurado en el servidor (`code: telegram_not_configured`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/me/notification-channels/telegram:
    delete:
      tags: [notifications]
      operationId: unlinkTelegram
      x-phase: 3
      summary: Desvincular Telegram
      description: "Idempotente: si no estaba vinculado devuelve 204."
      responses:
        "204":
          description: Telegram desvinculado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getMyNotificationPreferences
      x-phase: 3
      summary: Preferencias de notificación
      description: |
        Qué avisos llegan por qué canal. Por defecto todo activado; un aviso solo se envía si el
        canal está vinculado (y el correo verificado) y el usuario concedió el consentimiento
        `notifications` (el del paciente, si el usuario es un paciente con cuenta).
      responses:
        "200":
          description: Preferencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [notifications]
      operationId: setMyNotificationPreferences
      x-phase: 3
      summary: Guardar las preferencias de notificación
      description: Reemplazo completo e idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferencias guardadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /telegram/webhook:
    post:
      tags: [notifications]
      operationId: telegramWebhook
      x-phase: 3
      x-internal: true
      summary: Webhook del bot de Telegram (no lo usan la web ni el reloj)
      description: |
        Lo llama Telegram con cada actualización. Se autentica con la cabecera
        `X-Telegram-Bot-Api-Secret-Token` (el `secret_token` fijado al registrar el webhook); si
        no coincide, 401. Con `/start <token>` vincula el chat al usuario dueño del token (un token
        inválido o caducado se responde por chat, no con un error HTTP); `/stop` desvincula.
        Cualquier otra actualización se ignora. Responde 200 salvo secreto incorrecto.
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Actualización recibida.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patients/{patientId}/reports:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    get:
      tags: [reports]
      operationId: listReports
      x-phase: 3
      summary: Reportes semanales de un paciente
      description: |
        Del más reciente al más antiguo. Hay un reporte automático por semana (lunes a domingo)
        que se genera el lunes a las 08:00 en la zona horaria del paciente; también pueden
        pedirse a mano. Requiere vínculo con el paciente (404 si no) y consentimiento
        `health_data` (403 `consent_required`).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de reportes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [reports]
      operationId: createReport
      x-phase: 3
      summary: Pedir un reporte a mano
      description: |
        Genera el reporte de los 7 días que terminan en `periodEnd` (por defecto ayer, en la zona
        del paciente; no puede ser futuro). La generación es asíncrona: responde 202 con
        `status: pending` y la web consulta `GET /patients/{patientId}/reports/{reportId}` hasta
        `ready` o `failed`. Pedir el mismo `periodEnd` otra vez devuelve el reporte existente.
        Límite de peticiones por paciente (429).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "202":
          description: Reporte en generación (o el ya existente para ese periodo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /patients/{patientId}/reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/ReportIdPath"
    get:
      tags: [reports]
      operationId: getReport
      x-phase: 3
      summary: Un reporte
      description: "Con `status: ready` incluye el resumen; el PDF está en `.../pdf`."
      responses:
        "200":
          description: Reporte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{patientId}/reports/{reportId}/pdf:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
      - $ref: "#/components/parameters/ReportIdPath"
    get:
      tags: [reports]
      operationId: downloadReportPdf
      x-phase: 3
      summary: Descargar el reporte en PDF
      description: |
        Con sesión de usuario (cabecera `Authorization`), no por enlace público: la web lo pide con
        `fetch` y lo descarga como blob. Reporte aún en generación o fallido: 409
        (`code: report_not_ready`).
      responses:
        "200":
          description: Documento PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /patients/{patientId}/chat/messages:
    parameters:
      - $ref: "#/components/parameters/PatientIdPath"
    post:
      tags: [chat]
      operationId: sendChatMessage
      x-phase: 3
      summary: Preguntar al asistente sobre el plan de un paciente (web, SSE)
      description: |
        La respuesta llega como flujo `text/event-stream` (SSE) con tres tipos de evento:
        - `event: delta` con `data: {"text": "..."}` (trozos de la respuesta, en orden).
        - `event: done` con `data: {"remainingMessages": 27}` al terminar.
        - `event: error` con `data: {"code": "chat_unavailable"}` si el proveedor falla a medias.
        Los errores previos al flujo (sin acceso, sin consentimiento, límite) son problem+json
        normales con su código HTTP. Requiere vínculo con el paciente (404 si no) y consentimiento
        `ai_chat` del paciente (403 `consent_required`).

        El asistente conoce el plan del paciente (medicamentos, dosis y horarios) sin nombre,
        documento ni datos de contacto. No cambia dosis ni diagnostica. Sin estado en el servidor:
        el cliente envía en `history` los últimos turnos (máximo 10) y el servidor **no guarda el
        texto de la conversación**, solo el recuento de mensajes y tokens. Límite diario de
        mensajes por usuario: al superarlo, 429 con `code: chat_limit_reached` y `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Flujo SSE con la respuesta.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: delta
                data: {"text": "Esta noche te toca "}

                event: delta
                data: {"text": "la metformina a las 20:00."}

                event: done
                data: {"remainingMessages": 27}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /devices/me/chat/messages:
    post:
      tags: [chat]
      operationId: sendMyChatMessage
      x-phase: 3
      summary: Preguntar al asistente desde el reloj (respuesta corta)
      description: |
        Solo con token de reloj (403 con token de usuario). Mismas reglas, guardarraíles y
        consentimiento (`ai_chat` del paciente) que el chat web, pero responde JSON sin streaming y
        con una respuesta corta (como máximo 3 frases, sin listas ni formato) para leerla en voz
        alta. El límite diario cuenta por reloj.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Respuesta corta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchChatReply"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso de 15 min. Dos tipos: de usuario (web) y de reloj. `/devices/me` y
        `/devices/me/*` solo aceptan tokens de reloj; todas las demás rutas protegidas, solo
        tokens de usuario. El tipo equivocado responde 403 (`code: wrong_token_type`).

  parameters:
    RefreshCookie:
      name: __Secure-refresh-token
      in: cookie
      required: false
      description: Refresh token de la sesión web. Lo envía el navegador; JavaScript no puede leerlo.
      schema:
        type: string
        maxLength: 512
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto como `nextCursor` en la página anterior.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PatientIdPath:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentPurposePath:
      name: purpose
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsentPurpose"

    MedicationIdPath:
      name: medicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromQuery:
      name: from
      in: query
      required: false
      description: Inicio del rango (inclusive), fecha local del paciente.
      schema:
        type: string
        format: date
    ToQuery:
      name: to
      in: query
      required: false
      description: Fin del rango (inclusive), fecha local del paciente.
      schema:
        type: string
        format: date

    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    SetRefreshCookie:
      description: |
        `__Secure-refresh-token=<token>; HttpOnly; Secure; SameSite=Strict; Path=/auth;
        Max-Age=2592000`
      schema:
        type: string
    ClearRefreshCookie:
      description: |
        `__Secure-refresh-token=; HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=0`
      schema:
        type: string

  responses:
    Unauthorized:
      description: Falta el token, es inválido o caducó (o credenciales incorrectas en login).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Autenticado pero sin permiso: rol que no permite la acción sobre un recurso accesible, o
        tipo de token equivocado (`wrong_token_type`). Nunca se usa para pacientes sin vínculo
        (eso es 404).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No existe o el usuario no tiene acceso: un cuidador que pide un paciente sin vínculo
        activo (o sus recursos) recibe 404, igual que si no existiera, para no revelar datos
        ajenos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto con el estado actual (por ejemplo, correo ya registrado).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: La petición no cumple el esquema.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    TooManyRequests:
      description: Límite de peticiones superado.
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    InvalidToken:
      description: "Token de un solo uso inválido, caducado o ya usado (`code: invalid_token`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: |
        El proveedor externo (modelo de IA) no responde (`code: chat_unavailable`). Se puede
        reintentar; no consume el límite diario.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ─── Comunes ───────────────────────────────────────────────────────────────
    Problem:
      type: object
      description: Error según RFC 9457.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: Código estable legible por máquina (snake_case).
        instance:
          type: string
          format: uri-reference
      additionalProperties: true
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [loc, msg, type]
                properties:
                  loc:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  msg:
                    type: string
                  type:
                    type: string
    Timezone:
      type: string
      description: Zona horaria IANA.
      examples: [America/Bogota]
      minLength: 1
      maxLength: 64
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    Locale:
      type: string
      enum: [es]
      default: es

    # ─── Salud ─────────────────────────────────────────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          required: [database, redis]
          properties:
            database:
              type: string
              enum: [ok]
            redis:
              type: string
              enum: [ok]

    # ─── Auth ──────────────────────────────────────────────────────────────────
    Role:
      type: string
      enum: [patient, caregiver]
    RegisterRequest:
      type: object
      required: [email, password, displayName, role, timezone]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        displayName:
          $ref: "#/components/schemas/DisplayName"
        role:
          $ref: "#/components/schemas/Role"
        timezone:
          $ref: "#/components/schemas/Timezone"
        locale:
          $ref: "#/components/schemas/Locale"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    AccessToken:
      type: object
      description: Token de acceso de la sesión web (el refresh token va en la cookie).
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso.
          examples: [900]
    TokenPair:
      type: object
      description: Tokens del reloj, ambos en JSON (el reloj no usa cookies).
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso.
          examples: [900]
    AuthSession:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AccessToken"

    # ─── Usuario ───────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, emailVerified, displayName, role, timezone, locale, patientId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          $ref: "#/components/schemas/DisplayName"
        role:
          $ref: "#/components/schemas/Role"
        timezone:
          $ref: "#/components/schemas/Timezone"
        locale:
          $ref: "#/components/schemas/Locale"
        patientId:
          description: Perfil de paciente propio (solo rol `patient`).
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        emailVerified:
          type: boolean
          description: El correo se verificó con el enlace que llega al registrarse.
        createdAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        timezone:
          $ref: "#/components/schemas/Timezone"
        locale:
          $ref: "#/components/schemas/Locale"
    ConsentPurpose:
      type: string
      enum: [health_data, ai_chat, notifications]
    Consent:
      type: object
      required: [purpose, granted, version, updatedAt, grantedBy]
      properties:
        purpose:
          $ref: "#/components/schemas/ConsentPurpose"
        granted:
          type: boolean
        version:
          description: Versión del texto aceptado (null si nunca se ha respondido).
          oneOf:
            - type: string
            - type: "null"
        updatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        grantedBy:
          description: |
            Quién tomó la última decisión: el propio titular o, en un paciente gestionado, el
            cuidador que decidió en su nombre. Null si nunca se ha respondido.
          oneOf:
            - $ref: "#/components/schemas/ConsentActor"
            - type: "null"
    ConsentActor:
      type: object
      required: [userId, displayName, onBehalf]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          $ref: "#/components/schemas/DisplayName"
        onBehalf:
          type: boolean
          description: true si decidió un cuidador en nombre del paciente.
    ConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
    ConsentUpdate:
      type: object
      required: [granted, version]
      properties:
        granted:
          type: boolean
        version:
          type: string
          minLength: 1
          maxLength: 32
          description: Versión del texto que el usuario vio al decidir.

    # ─── Pacientes ─────────────────────────────────────────────────────────────
    Patient:
      type: object
      required: [id, displayName, timezone, managed, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          $ref: "#/components/schemas/DisplayName"
        timezone:
          $ref: "#/components/schemas/Timezone"
        managed:
          type: boolean
          description: true si no tiene cuenta propia y lo gestionan sus cuidadores.
        createdAt:
          type: string
          format: date-time
    PatientCreate:
      type: object
      required: [displayName, timezone]
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        timezone:
          $ref: "#/components/schemas/Timezone"
    PatientUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        timezone:
          $ref: "#/components/schemas/Timezone"
    PatientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    CareLink:
      type: object
      required: [patientId, caregiverId, caregiverDisplayName, active, createdAt]
      properties:
        patientId:
          type: string
          format: uuid
        caregiverId:
          type: string
          format: uuid
        caregiverDisplayName:
          $ref: "#/components/schemas/DisplayName"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CareLinkPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareLink"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    InvitationCode:
      type: string
      description: Código de un solo uso, 10 caracteres sin ambigüedades (sin 0/O, 1/I/L).
      pattern: "^[A-HJKMNP-Z2-9]{10}$"
    CaregiverInvitation:
      type: object
      required: [code, patientId, expiresAt]
      properties:
        code:
          $ref: "#/components/schemas/InvitationCode"
        patientId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    # ─── Reloj ─────────────────────────────────────────────────────────────────
    UserCode:
      type: string
      description: Código corto que muestra el reloj (formato XXXX-XXXX, alfabeto RFC 8628).
      pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$"
      examples: [WDJB-MJHT]
    PairingCodeRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 80
          description: Modelo del reloj (Build.MODEL).
        appVersion:
          type: string
          maxLength: 32
    PairingCode:
      type: object
      required: [code, deviceCode, expiresIn, interval]
      properties:
        code:
          $ref: "#/components/schemas/UserCode"
        deviceCode:
          type: string
          description: Secreto que solo conoce el reloj.
        expiresIn:
          type: integer
          description: Segundos de validez del código.
          examples: [600]
        interval:
          type: integer
          description: Segundos mínimos entre consultas a `POST /devices/token`.
          examples: [5]
    PairingConfirm:
      type: object
      required: [patientId]
      properties:
        patientId:
          type: string
          format: uuid
    DeviceTokenRequest:
      oneOf:
        - $ref: "#/components/schemas/DeviceCodeGrant"
        - $ref: "#/components/schemas/DeviceRefreshGrant"
      discriminator:
        propertyName: grantType
        mapping:
          device_code: "#/components/schemas/DeviceCodeGrant"
          refresh_token: "#/components/schemas/DeviceRefreshGrant"
    DeviceCodeGrant:
      type: object
      required: [grantType, deviceCode]
      properties:
        grantType:
          type: string
          const: device_code
        deviceCode:
          type: string
          minLength: 1
          maxLength: 256
    DeviceRefreshGrant:
      type: object
      required: [grantType, refreshToken]
      properties:
        grantType:
          type: string
          const: refresh_token
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
    Device:
      type: object
      required: [id, patientId, model, pairedAt, lastSeenAt, hasPushToken]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        model:
          type: string
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        hasPushToken:
          type: boolean
    DevicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    PushTokenUpdate:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Token de registro de FCM.

    # ─── Sprint A: medicamentos, horarios, plan, eventos, adherencia ──────────────
    Color:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      examples: ["#3B82F6"]
    Medication:
      type: object
      required: [id, patientId, name, dosage, color, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        name:
          type: string
        dosage:
          type: string
          description: Dosis por toma en texto libre ("1 tableta", "5 ml").
        instructions:
          type: [string, "null"]
        color:
          $ref: "#/components/schemas/Color"
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedicationCreate:
      type: object
      required: [name, dosage]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        dosage:
          type: string
          minLength: 1
          maxLength: 80
        instructions:
          type: [string, "null"]
          maxLength: 500
        color:
          $ref: "#/components/schemas/Color"
    MedicationUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        dosage:
          type: string
          minLength: 1
          maxLength: 80
        instructions:
          type: [string, "null"]
          maxLength: 500
        color:
          $ref: "#/components/schemas/Color"
    MedicationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Medication"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Hora local del paciente, HH:MM de 24 h.
      examples: ["08:00"]
    DayOfWeek:
      type: integer
      minimum: 1
      maximum: 7
      description: ISO 8601, 1 = lunes … 7 = domingo.
    Schedule:
      type: object
      required: [id, medicationId, times, daysOfWeek, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        medicationId:
          type: string
          format: uuid
        times:
          type: array
          description: Horas del día, sin repetir, ordenadas.
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LocalTime"
        daysOfWeek:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DayOfWeek"
        startDate:
          type: string
          format: date
          description: Primer día del tratamiento (fecha local del paciente).
        endDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
          description: Último día (inclusive); `null` = sin fin.
    ScheduleCreate:
      type: object
      required: [times, daysOfWeek, startDate]
      properties:
        times:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LocalTime"
        daysOfWeek:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DayOfWeek"
        startDate:
          type: string
          format: date
        endDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
          description: Debe ser mayor o igual que `startDate`.
    ScheduleUpdate:
      type: object
      minProperties: 1
      properties:
        times:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LocalTime"
        daysOfWeek:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DayOfWeek"
        startDate:
          type: string
          format: date
        endDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    PlannedDose:
      type: object
      required: [scheduleId, medicationId, medicationName, dosage, color, scheduledAt]
      properties:
        scheduleId:
          type: string
          format: uuid
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        dosage:
          type: string
        instructions:
          type: [string, "null"]
        color:
          $ref: "#/components/schemas/Color"
        scheduledAt:
          type: string
          format: date-time
          description: Instante de la dosis con el desfase de la zona del paciente. La dosis se identifica por `scheduleId` + `scheduledAt`.
    Plan:
      type: object
      required: [version, patientTimezone, generatedAt, validFrom, validUntil, doses]
      properties:
        version:
          type: integer
          minimum: 0
          description: Sube con cada cambio de medicamentos u horarios del paciente.
        patientTimezone:
          $ref: "#/components/schemas/Timezone"
        generatedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
          description: Inicio del día local del paciente en que se generó.
        validUntil:
          type: string
          format: date-time
          description: Fin del séptimo día (exclusivo).
        doses:
          type: array
          description: Ordenadas por `scheduledAt`.
          items:
            $ref: "#/components/schemas/PlannedDose"
    DoseEventStatus:
      type: string
      enum: [TAKEN, SKIPPED]
    DoseEventInput:
      type: object
      required: [eventId, scheduleId, scheduledAt, status, actedAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: Generado por el reloj; clave de idempotencia.
        scheduleId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/DoseEventStatus"
        actedAt:
          type: string
          format: date-time
          description: Cuándo pulsó el paciente en el reloj.
    DoseEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DoseEventInput"
    DoseEventResult:
      type: object
      required: [eventId, outcome]
      properties:
        eventId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [created, duplicate, rejected]
        code:
          type: [string, "null"]
          description: Presente solo si `rejected`.
    DoseEventBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DoseEventResult"
    DoseStatus:
      type: string
      enum: [TAKEN, SKIPPED, MISSED]
    DoseHistoryItem:
      type: object
      required: [scheduleId, medicationId, medicationName, dosage, scheduledAt, status, actedAt]
      properties:
        scheduleId:
          type: string
          format: uuid
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        dosage:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/DoseStatus"
        actedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: "`null` si `MISSED`."
    DoseHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DoseHistoryItem"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    Adherence:
      type: object
      required: [from, to, taken, skipped, missed, percentage]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        taken:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
        percentage:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: "null"

    # ─── Sprint B: cuenta por correo, notificaciones, reportes, chat ──────────────
    TokenBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    NotificationChannelType:
      type: string
      enum: [email, telegram]
    NotificationChannel:
      type: object
      required: [channel, linked, verified, label, linkedAt]
      properties:
        channel:
          $ref: "#/components/schemas/NotificationChannelType"
        linked:
          type: boolean
        verified:
          type: boolean
          description: Correo verificado; en Telegram es igual a `linked`.
        label:
          description: Correo enmascarado (`a***@example.com`) o usuario de Telegram; null si no está vinculado.
          oneOf:
            - type: string
            - type: "null"
        linkedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
    TelegramLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: "`https://t.me/<Bot>?start=<token>`; la web lo abre o lo muestra como botón y código QR."
        expiresAt:
          type: string
          format: date-time
    ChannelToggles:
      type: object
      required: [email, telegram]
      properties:
        email:
          type: boolean
        telegram:
          type: boolean
    NotificationPreferences:
      type: object
      required: [missedDose, weeklyReport]
      properties:
        missedDose:
          allOf:
            - $ref: "#/components/schemas/ChannelToggles"
          description: |
            Alerta de dosis omitida (una por dosis, cuando pasan 60 minutos sin evento). La reciben
            los cuidadores con vínculo activo del paciente.
        weeklyReport:
          allOf:
            - $ref: "#/components/schemas/ChannelToggles"
          description: |
            Aviso del reporte semanal, con resumen mínimo y enlace al reporte en el panel. Lo
            reciben los cuidadores y el propio paciente si tiene cuenta.
    ReportStatus:
      type: string
      enum: [pending, ready, failed]
    ReportTrigger:
      type: string
      enum: [weekly, manual]
    MedicationAdherence:
      type: object
      required: [medicationId, medicationName, taken, skipped, missed, percentage]
      properties:
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        taken:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
        percentage:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: "null"
    ReportSummary:
      type: object
      required: [taken, skipped, missed, percentage, byMedication]
      description: Mismas reglas que `GET /patients/{patientId}/adherence` sobre el periodo del reporte.
      properties:
        taken:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
        percentage:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: "null"
        byMedication:
          type: array
          items:
            $ref: "#/components/schemas/MedicationAdherence"
    Report:
      type: object
      required: [id, patientId, periodStart, periodEnd, trigger, status, createdAt, generatedAt, summary]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
          description: Inclusive; el periodo son 7 días.
        trigger:
          $ref: "#/components/schemas/ReportTrigger"
        status:
          $ref: "#/components/schemas/ReportStatus"
        createdAt:
          type: string
          format: date-time
        generatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        summary:
          description: "Solo con `status: ready`."
          oneOf:
            - $ref: "#/components/schemas/ReportSummary"
            - type: "null"
    ReportCreate:
      type: object
      properties:
        periodEnd:
          type: string
          format: date
          description: Último día del periodo (fecha local del paciente); por defecto ayer.
    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    ChatRole:
      type: string
      enum: [user, assistant]
    ChatTurn:
      type: object
      required: [role, content]
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
          minLength: 1
          maxLength: 1000
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
        history:
          type: array
          description: Turnos anteriores, del más antiguo al más reciente.
          maxItems: 10
          items:
            $ref: "#/components/schemas/ChatTurn"
    WatchChatReply:
      type: object
      required: [reply, remainingMessages]
      properties:
        reply:
          type: string
          description: Texto plano de hasta 3 frases, listo para leerse en voz alta.
        remainingMessages:
          type: integer
          minimum: 0
