# Dependencias de desarrollo: PostgreSQL (host 5433, para no chocar con un Postgres local) y Redis.
# La API corre nativa con `uv run`.
# Límites de memoria bajos a propósito para no cargar el equipo.
name: back-smartwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartwatch}
      POSTGRES_DB: ${POSTGRES_DB:-smartwatch}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
