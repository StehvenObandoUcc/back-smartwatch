[project]
name = "back-smartwatch"
version = "0.1.0"
description = "API de recordatorios de medicamentos (reloj Wear OS + panel web)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "schemathesis>=4.28.0",
    "testcontainers[postgres,redis]>=4.13.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy async ejecuta el código de los repositorios dentro de greenlets.
concurrency = ["thread", "greenlet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requiere Docker (Testcontainers)"]
addopts = "-ra --strict-markers --cov=app/modules --cov-report=term-missing"
